[package]
name = "asyar-gpui"
version = "0.0.1"
description = "Spike: native GPUI launcher shell for Linux (measurement prototype)."
license = "GPL-3.0-only"
edition = "2024"
publish = false

# Standalone on purpose: keeps GPUI's heavy build out of the Tauri workspace's
# `cargo test --workspace` / clippy CI until the spike is adopted.
[workspace]

[dependencies]
gpui = { package = "gpui-ce", version = "=0.3.0" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0" }
gpui_ce_elements = "=0.3.0"
asyar-search = { path = "../asyar-launcher/src-tauri/crates/asyar-search" }
sys-locale = "0.3"
futures = "0.3"
anyhow = "1"
freedesktop-icons = "0.4.0"
asyar-calculator = { path = "../asyar-launcher/src-tauri/crates/asyar-calculator" }
serde_json = "1.0.154"
rusqlite = { version = "0.31", features = ["bundled"] }
x11rb = { version = "0.13", features = ["randr"] }
raw-window-handle = "0.6"
tokio = { version = "1", features = ["rt"] }
image = { version = "0.25", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = "line-tables-only"
