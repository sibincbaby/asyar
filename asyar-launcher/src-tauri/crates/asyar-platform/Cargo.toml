[package]
name = "asyar-platform"
version = "0.1.0"
description = "OS-level window, keyboard, and display abstractions for Asyar."
authors = ["Khoshbin Ali <xoshbin@gmail.com>"]
license = "GPL-3.0-only"
edition = "2021"

[features]
# Enabled only by the launcher dev-dependency for cross-crate integration tests.
test-support = []

[dependencies]
log = "0.4"
raw-window-handle = "0.6"
enigo = "0.1.3"
dirs = "5.0"
sys-locale = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
xkbcommon = "0.7"
gtk = "0.18"
gdk = "0.18"
gio = "0.18"
gdkx11 = "0.18"
x11rb = "0.13"
zbus = { version = "4", features = ["blocking"] }

[dev-dependencies]
tempfile = "3.10"
serial_test = "3"
serde_json = "1"
