name: Test & Lint

on:
  workflow_call:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-and-lint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend & Workspace Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test workspace setup version checks
        run: pnpm test:setup

      - name: Check Prettier formatting
        run: pnpm format:check

      - name: Check design system compliance
        run: pnpm check:design

      - name: Sync SvelteKit
        run: pnpm svelte-kit sync
        working-directory: asyar-launcher

      - name: Check launcher Svelte types
        run: pnpm --dir asyar-launcher check

      - name: Run workspace tests (SDK + launcher frontend)
        run: pnpm -r --if-present test:run

      # `test:run`'s `pretest:run` hook (each package's package.json) just
      # regenerated these from their Rust source as a side effect of the step
      # above. If the committed files don't match, someone edited the Rust
      # source (permissions.rs / error.rs / search_engine/mod.rs /
      # runtimes/catalog.fallback.json) without re-running the matching
      # `gen:*` script — fail loudly instead of merging stale copies.
      - name: Verify generated Rust-derived files are up to date
        run: |
          git diff --exit-code -- \
            asyar-launcher/src/services/diagnostics/kinds.ts \
            asyar-launcher/src/services/extension/gatedPermissions.ts \
            asyar-sdk/cli/lib/knownRuntimes.ts \
            asyar-sdk/cli/lib/gatedPermissions.ts

  test-rust-linux:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Reclaim disk space on the standard GitHub Actions runner before installing
      # dependencies and restoring the Rust cache. Unused pre-installed SDKs
      # (.NET, Android, Haskell) take up ~30 GB, leaving less than 15 GB free.
      # Without this cleanup, the runner runs out of disk space when linking
      # the test binaries and GNU ld aborts with SIGBUS (signal 7 [Bus error]).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install system dependencies (Tauri / webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: asyar-launcher/src-tauri -> target
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: asyar-launcher/src-tauri

      - name: Install workspace dependencies (for build.rs SDK-version read)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Rust tests
        run: cargo test --workspace
        working-directory: asyar-launcher/src-tauri

      # Proves select_keystore falls back to FileKeyStore when Secret Service is absent.
      - name: Test fallback keystore (no Secret Service)
        working-directory: asyar-launcher/src-tauri
        env:
          ASYAR_KEYCHAIN_SERVICE: org.asyar.keystore-test
          ASYAR_EXPECT_KEYSTORE: file
        run: |
          cargo test --lib crypto::keystore::tests::select_keystore_matches_expected_backend -- --ignored
          cargo test --lib crypto::keystore::tests::file_keystore

      # Proves select_keystore and OsKeyStore work when a real Secret Service daemon is running.
      - name: Test OS keychain integration (with Secret Service)
        working-directory: asyar-launcher/src-tauri
        env:
          ASYAR_KEYCHAIN_SERVICE: org.asyar.keystore-test
          ASYAR_EXPECT_KEYSTORE: os
        run: |
          sudo apt-get install -y gnome-keyring libsecret-tools dbus
          dbus-run-session -- bash -euo pipefail << 'EOF'
          KEYRING_DIR="$HOME/.local/share/keyrings"
          mkdir -p "$KEYRING_DIR"
          chmod 700 "$KEYRING_DIR"
          printf "[keyring]\ndisplay-name=Default keyring\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n" > "$KEYRING_DIR/Default_keyring.keyring"
          printf "Default_keyring\n" > "$KEYRING_DIR/default"
          chmod 600 "$KEYRING_DIR/Default_keyring.keyring" "$KEYRING_DIR/default"

          eval $(printf "" | gnome-keyring-daemon --daemonize --login --components=secrets)
          eval "$(gnome-keyring-daemon --start --components=secrets)"
          printf 'probe' | secret-tool store --label='Asyar Secret Service probe' service org.asyar.keystore-test account ci-probe
          test "$(secret-tool lookup service org.asyar.keystore-test account ci-probe)" = probe
          secret-tool clear service org.asyar.keystore-test account ci-probe

          cargo test --lib crypto::keystore -- --ignored --skip os_keystore_persist
          cargo test --lib crypto::keystore::tests::os_keystore_persist_write -- --ignored
          cargo test --lib crypto::keystore::tests::os_keystore_persist_read -- --ignored
          EOF

      # Regenerates launcher and SDK bindings (specta) from Rust types registered in
      # search_engine/models.rs::export_bindings — normally run manually, so
      # this is the only thing that catches "added/changed a #[derive(Type)]
      # struct and forgot to regenerate."
      - name: Regenerate TypeScript bindings from Rust types
        run: cargo test export_bindings -- --ignored
        working-directory: asyar-launcher/src-tauri

      - name: Verify generated TypeScript bindings are up to date
        run: git diff --exit-code -- asyar-launcher/src/bindings.ts asyar-sdk/src/generated/calculator.ts asyar-sdk/src/generated/files.ts

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: asyar-launcher/src-tauri

      - name: Check Rust docs compile
        run: cargo doc --no-deps --document-private-items
        working-directory: asyar-launcher/src-tauri
        env:
          RUSTDOCFLAGS: '-D warnings'

  # Aggregator gate job required by GitHub branch ruleset (`context: "test-and-lint"`).
  # Runs after all parallel jobs finish, ensuring that frontend and Rust
  # jobs passed, and blocks merge if any job failed.
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    needs:
      - frontend
      - test-rust-linux
    if: always()
    steps:
      - name: Verify all matrix checks succeeded
        run: |
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Rust (Linux): ${{ needs.test-rust-linux.result }}"

          if [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.test-rust-linux.result }}" != "success" ]; then
            echo "::error::One or more test matrix jobs failed."
            exit 1
          fi

          echo "All checks passed successfully."
